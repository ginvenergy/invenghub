<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Disponibilidade Energética (PBA) | Plataforma de Engenharia</title><style>:root{--navy:#1a3c5e;--navy-d:#0d1f30;--green:#78BE20;--green-t:#4d7a15;--orange:#F07E1A;--orange-t:#ad570b;--red:#b42318;--amber:#8a5a00;--blue:#1a5490;
--border:#d8e3ee;--bg:#eef2f7;--card:#fff;--text:#1a2b3c;--muted:#56707d;--muted2:#606f79;--ess:#1a778f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.topbar{background:var(--navy);height:58px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.tl{display:flex;align-items:center;gap:14px}.tl img{height:27px}.tdiv{width:1px;height:22px;background:rgba(255,255,255,.25)}
.tt{color:#fff;font-weight:600}.tt b{color:var(--green)}
.tr{display:flex;gap:8px;align-items:center}
.tb{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:7px 12px;cursor:pointer;text-decoration:none;font-weight:600;font-size:12.5px}
.tb:hover{background:rgba(255,255,255,.12)}.tb.u{border-color:var(--green)}
.hero{background:linear-gradient(135deg,var(--navy-d),var(--navy) 62%,#24557f);padding:20px 24px 0;position:relative}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--green) 55%,var(--orange) 55%)}
.hin{max-width:1360px;margin:0 auto}
.bc{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:8px}.bc a{color:rgba(255,255,255,.75);text-decoration:none}
.hero h1{color:#fff;font-size:23px;font-weight:800}.hero h1 em{font-style:normal;color:var(--green)}
.hsub{color:rgba(255,255,255,.7);font-size:12.5px;margin-top:5px}
.nav{display:flex;gap:4px;margin-top:16px}
.nav button{background:transparent;border:none;color:rgba(255,255,255,.72);padding:10px 16px;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0}
.nav button.on{background:var(--bg);color:var(--navy)}
.main{max-width:1360px;margin:0 auto;padding:22px 24px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--green) 55%,var(--orange) 55%)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--border);background:#fff;color:var(--navy);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600}
.btn:hover{background:#f3f7fb}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g{background:var(--green);border-color:var(--green);color:var(--navy-d)}.btn.g:hover{background:#6aab1b}
.btn.n{background:var(--navy);border-color:var(--navy);color:#fff}.btn.n:hover{background:#12293f}
.btn.r{color:var(--red);border-color:#f0c4c0}.btn.s{padding:5px 10px;font-size:12px}
input[type=text],input[type=month],input[type=number],select,textarea{border:1px solid var(--border);border-radius:7px;padding:7px 10px;background:#fff;color:var(--text)}
textarea{width:100%;min-height:60px}
.muted{color:var(--muted)}.small{font-size:11.5px}
table.t{width:100%;border-collapse:collapse}
.t th{background:#f4f7fb;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid #eef2f6;vertical-align:top}
.t tr:hover td{background:#f9fbfd}
.tw{overflow:auto;max-height:620px;border:1px solid var(--border);border-radius:8px}
.t th.num{text-align:right}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:12px;white-space:nowrap}
.c-ok{background:#e6f4d7;color:#3a6410}.c-warn{background:#fff2d4;color:var(--amber)}.c-bad{background:#fde3e1;color:var(--red)}.c-info{background:#e3eef9;color:var(--blue)}.c-gray{background:#eef1f4;color:var(--muted2)}.c-navy{background:var(--navy);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;border-top:3px solid var(--navy)}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.kpi .v{font-size:22px;font-weight:800;color:var(--navy);margin-top:5px}.kpi .s{font-size:11px;color:var(--muted);margin-top:3px}
.cxtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cxt{background:#fff;border:1px solid var(--border);border-radius:9px;padding:10px 14px;cursor:pointer;min-width:190px;text-align:left}
.cxt.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.cxt b{display:block;color:var(--navy);font-size:14px}
.sub{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px}
.sub button{border:none;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.sub button.on{color:var(--navy);border-bottom-color:var(--green)}
.al{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}
.al.bloqueia{border-left-color:var(--red)}.al.alerta{border-left-color:#e0a100}.al.info{border-left-color:#7fa6cc}.al.ok{border-left-color:var(--green)}
.al .h{display:flex;gap:8px;align-items:flex-start}.al .h .tx{flex:1;font-weight:600}
.al .d{color:var(--muted);margin-top:4px;line-height:1.5}
.al details{margin-top:6px}.al summary{cursor:pointer;color:var(--blue);font-size:12px}
.al .oc{max-height:180px;overflow:auto;font-family:Consolas,monospace;font-size:11.5px;background:#f7f9fb;border-radius:6px;padding:6px 8px;margin-top:6px}
.dec{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gate{position:sticky;bottom:0;background:#fff;border:2px solid var(--navy);border-radius:10px;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.dz{border:2px dashed var(--border);border-radius:9px;padding:16px;text-align:center;cursor:pointer;background:#f8fafc;flex:1;min-width:230px}
.dz:hover,.dz.over{border-color:var(--green);background:#f3f9ec}
.dz b{color:var(--navy);display:block}
.bd{position:fixed;inset:0;background:rgba(13,31,48,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.bd.on{display:flex}
.md{background:#fff;border-radius:12px;max-width:820px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.md .mh{background:var(--navy);color:#fff;padding:16px 20px;font-weight:700;font-size:15px}
.md .mb{padding:18px 20px;overflow:auto}.md .mf{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:#f7f9fb}
.banner{border-radius:9px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.b-warn{background:#fff6e0;border:1px solid #f0d58f;color:var(--amber)}.b-ok{background:#eef8e3;border:1px solid #cfe7a8;color:#3a6410}.b-bad{background:#fde8e6;border:1px solid #f3b9b3;color:var(--red)}.b-info{background:#e8f1fb;border:1px solid #bcd3ec;color:var(--blue)}
.mono{font-family:Consolas,monospace;font-size:11.5px}
.bar{display:flex;align-items:flex-end;gap:2px;height:140px;padding:6px 0;border-bottom:1px solid var(--border)}
.bar div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
.bar i{display:block;border-radius:2px 2px 0 0}
.hidden{display:none!important}
.pg{display:flex;gap:6px;align-items:center;margin-top:8px}
</style></head>

document.addEventListener('change',async function(e){var t=e.target;try{
  if(t.dataset.act==='ciente'&&t.checked)await marcarCiente();
  else if(t.id==='f-scada'){await importarScada(Array.from(t.files));t.value='';}
  else if(t.id==='f-carve'){await importarCarve(Array.from(t.files),$('cxCarve').value);t.value='';}
  else if(t.id==='f-calc'){if(t.files[0])await importarCalculadora(t.files[0],ST.modoCalc);t.value='';}
  else if(t.id==='f-mod'){if(t.files[0])await registrarModelo(t.files[0]);t.value='';}
  else if(t.id==='f-bkp'){if(t.files[0])await importarBackup(t.files[0]);t.value='';}
  else if(t.id==='mes'){if(t.value)await abrirMes(t.value);}
  else if(t.id==='verSel'){ST.verSel[ST.apur.ym+'|'+ST.cx]=+t.value;ST.pagina=0;render();}
  else if(t.id==='ano'){ST.ano=t.value;render();}else if(t.id==='rasc'){ST.inclRasc=t.checked;render();}else if(t.id==='ordCO'){ST.ordCO=t.value;render();}
  else if(t.id==='filtro'){ST.filtro=t.value;ST.pagina=0;render();}else if(t.id==='mostraSPE'){ST.mostraSPE=t.checked;render();}
  else if(t.dataset.cad){var p=t.dataset.cad.split('|'),cx=Motor.cxDe(ST.cad,p[0]),s=cx.spes[+p[1]],old=s[p[2]],nv=p[2]==='comercial'?t.value:+t.value;if(p[2]!=='comercial'&&(!isFinite(nv)||nv<=0)){t.value=old;return;}
    if(!confirm('Alterar '+p[2]+' de '+s.cod+' de "'+old+'" para "'+nv+'"?')){t.value=old;return;}s[p[2]]=nv;await salvarCad(s.cod+' · '+p[2]+': '+old+' → '+nv);}
  }catch(err){console.error(err);aviso('✖ '+esc(err.message),'bad');}});
document.addEventListener('input',function(e){if(e.target.id==='qlog'){ST.qlog=e.target.value;clearTimeout(ST._q);ST._q=setTimeout(function(){rLog().then(function(){var q=$('qlog');q.focus();q.setSelectionRange(q.value.length,q.value.length);});},250);}});
['dragover','dragenter'].forEach(function(ev){document.addEventListener(ev,function(e){var z=e.target.closest&&e.target.closest('.dz');if(z){e.preventDefault();z.classList.add('over');}});});
document.addEventListener('dragleave',function(e){var z=e.target.closest&&e.target.closest('.dz');if(z)z.classList.remove('over');});
document.addEventListener('drop',async function(e){var z=e.target.closest&&e.target.closest('.dz');if(!z)return;e.preventDefault();z.classList.remove('over');var fs=Array.from(e.dataTransfer.files);
  if(z.dataset.dz==='scada')await importarScada(fs);else if(z.dataset.dz==='carve')await importarCarve(fs,$('cxCarve').value);else if(fs[0])await importarCalculadora(fs[0],'conferir');});
function dadosEmTela(){var vv=versaoEmVista();if(vv){var w=ST.vistas[chaveVista(ST.apur.ym,ST.cx,vv)];if(w&&w!=='carregando'&&!w.erro)return w;}return computar(ST.cx);}
function csvCO(){var c=dadosEmTela(),r=c.res,ix={};c.inc.forEach(function(x,k){ix[x.uid]=k;});var q=function(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"';},den=r?(r.AP+r.LPp):1;
  var L=[['Arquivo','Aba','Linha','Nome no arquivo','Turbina','SPE','Início','Fim','Categoria','Situação','Intervalos','MWh recuperados','PBA (pp)','Isolado (pp)'].map(q).join(';')];
  c.cos.forEach(function(x){var k=ix[x.uid],pl=k!=null&&r?r.porLinha[k]:null;L.push([String(x.orig.arquivo).split(' › ')[0],x.orig.aba||'',x.orig.linhaOrig,x.orig.nome,x.id,x.spe,Motor.fmtDH(x.ini),Motor.fmtDH(x.fim),String(x.cat).trim(),x.incluida?'Incluída':x.excluida?'Excluída':'Pendente',pl?pl.int:'',pl?pl.mwh.toFixed(4).replace('.',','):'',pl?(pl.mwh/den*100).toFixed(5).replace('.',','):'',k!=null&&r?(r.isolado[k]*100).toFixed(5).replace('.',','):''].map(q).join(';'));});
  baixarBlob(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}),'Carveouts_'+ST.cx+'_'+ST.apur.ym+(c.emitida?'_v'+c.versao:'')+'.csv');}
function pedirUsuario(){modal('Identificação','<p style="margin-bottom:10px">Informe seu nome. Ele é registrado em cada importação, decisão, cálculo e emissão.</p><input type="text" id="nomeU" value="'+esc(ST.usuario)+'" style="width:100%" placeholder="Nome e sobrenome">',[['Salvar',null]]);
  $('md-f').querySelector('[data-mb="0"]').onclick=async function(ev){ev.stopPropagation();var v=$('nomeU').value.trim();if(!v){$('nomeU').focus();return;}var old=ST.usuario;ST.usuario=v;await DB.set('usuario',v);await logar('Identificação',old?'Trocou de "'+old+'" para "'+v+'"':'Primeiro acesso');fecharModal();render();};}
async function iniciarDados(){ST.cad=(await DB.get('cad'))||Motor.clone(Motor.CAD_PADRAO);if(!ST.cad.aliases)ST.cad.aliases={};
  Motor.CAD_PADRAO.premissas.forEach(function(p){if(ST.cad.premissas.indexOf(p)<0)ST.cad.premissas.push(p);});ST.cad.demandaTag=Motor.CAD_PADRAO.demandaTag;
  ST.usuario=(await DB.get('usuario'))||'';ST.emisIdx=(await DB.get('emisidx'))||[];ST.apurIdx=(await DB.get('apuridx'))||{};ST.modIdx=(await DB.get('modidx'))||{};}
(async function(){try{await DB.open();await iniciarDados();await DB.set('cad',ST.cad);var d=new Date();d.setMonth(d.getMonth()-1);await abrirMes(d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2));if(!ST.usuario)pedirUsuario();}
  catch(e){console.error(e);document.body.insertAdjacentHTML('afterbegin','<div class="banner b-bad">Não foi possível abrir o armazenamento local: '+esc(e.message)+'</div>');}})();
</script></body></html>
