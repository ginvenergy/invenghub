<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Condição de Grandes Componentes | Plataforma de Engenharia</title><style>:root{--navy:#1a3c5e;--navy-d:#0d1f30;--green:#78BE20;--green-t:#4d7a15;--orange:#F07E1A;--red:#b42318;--amber:#8a5a00;--blue:#1a5490;--border:#d8e3ee;--bg:#eef2f7;--text:#1a2b3c;--muted:#56707d}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}button,input,select,textarea{font-family:inherit;font-size:inherit}
.topbar{background:var(--navy);height:58px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.tl{display:flex;align-items:center;gap:14px}.tl img{height:27px}.tdiv{width:1px;height:22px;background:rgba(255,255,255,.25)}.tt{color:#fff;font-weight:600}.tt b{color:var(--green)}.tr{display:flex;gap:8px}
.tb{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:7px 12px;cursor:pointer;text-decoration:none;font-weight:600;font-size:12.5px}.tb:hover{background:rgba(255,255,255,.12)}
.hero{background:linear-gradient(135deg,var(--navy-d),var(--navy) 62%,#24557f);padding:20px 24px 0;position:relative}.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--green) 55%,var(--orange) 55%)}
.hin{max-width:1500px;margin:0 auto}.bc{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:8px}.bc a{color:rgba(255,255,255,.75);text-decoration:none}
.hero h1{color:#fff;font-size:23px;font-weight:800}.hero h1 em{font-style:normal;color:var(--green)}.hsub{color:rgba(255,255,255,.72);font-size:12.5px;margin-top:5px}
.hbox{color:rgba(255,255,255,.78);font-size:11.5px;line-height:1.6;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:9px 14px}.hbox b{color:#fff}
.nav{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap}.nav button{background:transparent;border:none;color:rgba(255,255,255,.75);padding:10px 15px;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0}.nav button.on{background:var(--bg);color:var(--navy)}
.main{max-width:1500px;margin:0 auto;padding:22px 24px 60px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}.card h3::before{content:'';width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--green) 55%,var(--orange) 55%)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.muted{color:var(--muted)}.small{font-size:11.5px}.mono{font-family:Consolas,monospace;font-size:11.5px}
.btn{border:1px solid var(--border);background:#fff;color:var(--navy);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600}.btn:hover{background:#f3f7fb}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.g{background:var(--green);border-color:var(--green);color:var(--navy-d)}.btn.n{background:var(--navy);border-color:var(--navy);color:#fff}.btn.r{color:var(--red);border-color:#f0c4c0}.btn.s{padding:5px 10px;font-size:12px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--border);border-radius:7px;padding:7px 10px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;border-top:3px solid var(--navy)}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}.kpi .v{font-size:22px;font-weight:800;color:var(--navy);margin-top:5px}.kpi .s{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.kpi.bad{border-top-color:var(--red)}.kpi.bad .v{color:var(--red)}.kpi.ok{border-top-color:var(--green)}.kpi.or{border-top-color:var(--orange)}
table.t{width:100%;border-collapse:collapse}.t th{background:#f4f7fb;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
.t th.num{text-align:right}.t td{padding:7px 10px;border-bottom:1px solid #eef2f6;vertical-align:top}.t tr.ck{cursor:pointer}.t tr:hover td{background:#f9fbfd}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.t td b{white-space:nowrap}
.t th.grp{text-align:center;color:#fff;font-size:11px}.t th.sec{background:#78BE20}.t th.pri{background:#F0B41A;color:#1a2b3c}
.tw{overflow:auto;max-height:640px;border:1px solid var(--border);border-radius:8px}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:12px;white-space:nowrap}.c-ok{background:#e6f4d7;color:#3a6410}.c-warn{background:#fff2d4;color:var(--amber)}.c-bad{background:#fde3e1;color:var(--red)}.c-info{background:#e3eef9;color:var(--blue)}.c-gray{background:#eef1f4;color:#606f79}.c-navy{background:var(--navy);color:#fff}
.cat{display:inline-block;min-width:54px;text-align:center;font-weight:800;font-size:11px;padding:4px 8px;border-radius:6px}.cat1{background:#e6f4d7;color:#3a6410}.cat2{background:#ffe9b8;color:#8a5a00}.cat3{background:#fdd3bf;color:#9a3a0a}.cat4{background:#f7c1bc;color:#8c1d14}.catS{background:#eef1f4;color:#606f79}
.st-Normal{color:#3a6410}.st-Atenção{color:#8a5a00}.st-Anormal{color:#ad570b}.st-Crítico{color:var(--red)}
.banner{border-radius:9px;padding:10px 14px;margin-bottom:14px;font-weight:600;line-height:1.55}.b-warn{background:#fff6e0;border:1px solid #f0d58f;color:var(--amber)}.b-ok{background:#eef8e3;border:1px solid #cfe7a8;color:#3a6410}.b-bad{background:#fde8e6;border:1px solid #f3b9b3;color:var(--red)}.b-info{background:#e8f1fb;border:1px solid #bcd3ec;color:var(--blue)}
.sub{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}.sub button{border:none;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}.sub button.on{color:var(--navy);border-bottom-color:var(--green)}
.dz{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;background:#f8fafc;flex:1;min-width:220px}.dz:hover,.dz.over{border-color:var(--green);background:#f3f9ec}.dz b{color:var(--navy);display:block;margin-bottom:4px}
.bd{position:fixed;inset:0;background:rgba(13,31,48,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.bd.on{display:flex}
.md{background:#fff;border-radius:12px;max-width:1240px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}.md .mh{background:var(--navy);color:#fff;padding:14px 20px;font-weight:700;font-size:15px}.md .mb{padding:18px 20px;overflow:auto}.md .mf{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:#f7f9fb}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.ins{border-left:3px solid var(--orange);background:#fffaf3;border-radius:7px;padding:8px 12px;margin-bottom:6px;line-height:1.5}
.hash{font-family:Consolas,monospace;font-size:11px;word-break:break-all;background:#f4f7fb;border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.pend{color:#9aa9b5;font-style:italic;font-size:11.5px}.pg{display:flex;gap:6px;align-items:center;margin-top:8px}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--muted)}.lg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hm{border-collapse:separate;border-spacing:2px;font-size:10.5px}.hm th{font-size:10px;color:var(--muted);font-weight:700;padding:3px;background:#fff;position:sticky;top:0;z-index:2}.hm th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:118px;white-space:nowrap;vertical-align:bottom}
.hm td{padding:0;height:24px;min-width:26px;text-align:center;border-radius:3px;cursor:default}.hm td.lb{text-align:left;padding:0 8px;white-space:nowrap;background:#fff;position:sticky;left:0;z-index:1;font-weight:600;color:var(--navy);cursor:pointer}
.hm td.x{min-width:74px;padding:0 6px;font-weight:700;white-space:nowrap}.hm .sepL{border-left:3px solid #fff}
.k1{background:#9fd86a;color:#203d08}.k2{background:#f6d04d;color:#4a3b00}.k3{background:#f39a4e;color:#4a1f00}.k4{background:#e0574d;color:#fff}.k0{background:#eef1f4;color:#9aa9b5}
.sbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:#eef1f4;min-width:120px}.sbar i{display:block;height:100%}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
</style></head>
