<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Budget de Engenharia | Plataforma de Engenharia</title><style>:root{--navy:#1a3c5e;--navy-d:#0d1f30;--green:#78BE20;--green-t:#4d7a15;--orange:#F07E1A;--orange-t:#ad570b;--red:#b42318;--amber:#8a5a00;--blue:#1a5490;--border:#d8e3ee;--bg:#eef2f7;--text:#1a2b3c;--muted:#56707d}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}button,input,select{font-family:inherit;font-size:inherit}
.topbar{background:var(--navy);height:58px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.tl{display:flex;align-items:center;gap:14px}.tl img{height:27px}.tdiv{width:1px;height:22px;background:rgba(255,255,255,.25)}.tt{color:#fff;font-weight:600}.tt b{color:var(--green)}.tr{display:flex;gap:8px}
.tb{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:7px 12px;cursor:pointer;text-decoration:none;font-weight:600;font-size:12.5px}.tb:hover{background:rgba(255,255,255,.12)}.tb.pri{background:var(--green);border-color:var(--green);color:var(--navy-d)}
.hero{background:linear-gradient(135deg,var(--navy-d),var(--navy) 62%,#24557f);padding:20px 24px 0;position:relative}.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--green) 55%,var(--orange) 55%)}
.hin{max-width:1380px;margin:0 auto}.bc{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:8px}.bc a{color:rgba(255,255,255,.75);text-decoration:none}
.hero h1{color:#fff;font-size:23px;font-weight:800}.hero h1 em{font-style:normal;color:var(--green)}.hsub{color:rgba(255,255,255,.72);font-size:12.5px;margin-top:5px}
.hbox{color:rgba(255,255,255,.75);font-size:11.5px;line-height:1.6;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:9px 14px}.hbox b{color:#fff}
.nav{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap}.nav button{background:transparent;border:none;color:rgba(255,255,255,.75);padding:10px 15px;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0}.nav button.on{background:var(--bg);color:var(--navy)}
.main{max-width:1380px;margin:0 auto;padding:22px 24px 60px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}.card h3::before{content:'';width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--green) 55%,var(--orange) 55%)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.muted{color:var(--muted)}.small{font-size:11.5px}.mono{font-family:Consolas,monospace;font-size:11.5px}
.btn{border:1px solid var(--border);background:#fff;color:var(--navy);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600}.btn:hover{background:#f3f7fb}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.g{background:var(--green);border-color:var(--green);color:var(--navy-d)}.btn.n{background:var(--navy);border-color:var(--navy);color:#fff}.btn.s{padding:5px 10px;font-size:12px}
input[type=text],select{border:1px solid var(--border);border-radius:7px;padding:7px 10px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;border-top:3px solid var(--navy)}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}.kpi .v{font-size:21px;font-weight:800;color:var(--navy);margin-top:5px;white-space:nowrap}.kpi .s{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.kpi.bad{border-top-color:var(--red)}.kpi.bad .v{color:var(--red)}.kpi.ok{border-top-color:var(--green)}.kpi.ok .v{color:var(--green-t)}.kpi.or{border-top-color:var(--orange)}
table.t{width:100%;border-collapse:collapse}.t th{background:#f4f7fb;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
.t th.num{text-align:right}.t td{padding:7px 10px;border-bottom:1px solid #eef2f6;vertical-align:middle}.t tr:hover td{background:#f9fbfd}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tr.g1 td{font-weight:700;background:#f7fafc}.t tr.tot td{font-weight:800;background:#eaf0f6;border-top:2px solid var(--navy)}.t tr.n4 td:first-child{padding-left:30px}.t tr.n4 td{color:#33495b;font-size:12px}
.tw{overflow:auto;max-height:640px;border:1px solid var(--border);border-radius:8px}
.neg{color:var(--red);font-weight:700}.pos{color:var(--green-t);font-weight:700}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:12px;white-space:nowrap}.c-ok{background:#e6f4d7;color:#3a6410}.c-warn{background:#fff2d4;color:var(--amber)}.c-bad{background:#fde3e1;color:var(--red)}.c-info{background:#e3eef9;color:var(--blue)}.c-gray{background:#eef1f4;color:#606f79}.c-foc{background:var(--navy);color:#fff}
.bar{height:8px;background:#e9eef3;border-radius:5px;overflow:hidden;position:relative;min-width:90px}.bar i{display:block;height:100%}.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--navy)}
.tog{cursor:pointer;color:var(--blue);font-weight:700;user-select:none;display:inline-block;width:16px}
.banner{border-radius:9px;padding:10px 14px;margin-bottom:14px;font-weight:600;line-height:1.55}.b-warn{background:#fff6e0;border:1px solid #f0d58f;color:var(--amber)}.b-ok{background:#eef8e3;border:1px solid #cfe7a8;color:#3a6410}.b-bad{background:#fde8e6;border:1px solid #f3b9b3;color:var(--red)}.b-info{background:#e8f1fb;border:1px solid #bcd3ec;color:var(--blue)}
.al{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}.al.erro{border-left-color:var(--red)}.al.alerta{border-left-color:#e0a100}.al.info{border-left-color:#7fa6cc}.al.ok{border-left-color:var(--green)}
.al .h{display:flex;gap:8px;align-items:flex-start}.al .tx{flex:1;font-weight:600}.al .d{color:var(--muted);margin-top:4px;line-height:1.5}.al summary{cursor:pointer;color:var(--blue);font-size:12px;margin-top:6px}.al .oc{max-height:200px;overflow:auto;font-family:Consolas,monospace;font-size:11.5px;background:#f7f9fb;border-radius:6px;padding:6px 8px;margin-top:6px}
.dz{border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;cursor:pointer;background:#f8fafc}.dz:hover,.dz.over{border-color:var(--green);background:#f3f9ec}.dz b{color:var(--navy);display:block;font-size:14px;margin-bottom:4px}
.bd{position:fixed;inset:0;background:rgba(13,31,48,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.bd.on{display:flex}
.md{background:#fff;border-radius:12px;max-width:900px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}.md .mh{background:var(--navy);color:#fff;padding:16px 20px;font-weight:700;font-size:15px}.md .mb{padding:18px 20px;overflow:auto}.md .mf{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:#f7f9fb}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.ins{border-left:3px solid var(--orange);background:#fffaf3;border-radius:7px;padding:10px 12px;margin-bottom:8px;line-height:1.55}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--muted)}.lg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hash{font-family:Consolas,monospace;font-size:11px;word-break:break-all;background:#f4f7fb;border:1px solid var(--border);border-radius:6px;padding:6px 8px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
</style></head>

function destaques(){var C=X.C,o=[],te=grupoPorNome('T&E'),co=grupoPorNome('Consumables'),ve=grupoPorNome('Vehicle'),d=ST.base.d;

  [te,co].forEach(function(g){if(!g)return;g.filhos.forEach(function(a){if(!(a.bud>0)&&(a.inc+a.fc)>0.5)o.push('<b>'+esc(g.item)+'</b> · '+esc(a.item)+': '+brl(a.inc+a.fc)+' entre incorrido e forecast <b>sem budget</b> na conta.');if(a.bud>0&&Math.abs(a.inc+a.fc)<0.5)o.push('<b>'+esc(g.item)+'</b> · '+esc(a.item)+': budget de '+brl(a.bud)+' <b>sem execução nem forecast</b>.');});});
  var fcT=te?te.m:null;if(fcT){var lr=d.real.lastIndexOf(true),mxm=0,mk=-1;for(var k=lr+1;k<12;k++)if(fcT[k]>mxm){mxm=fcT[k];mk=k;}if(mk>=0&&te.fc&&mxm/te.fc>0.4)o.push('<b>T&E</b>: '+pct(mxm/te.fc)+' do forecast restante concentrado em '+MESL[mk].toLowerCase()+' ('+brl(mxm)+').');}

function insightsGrupo(g,led){var d=ST.base.d,o=[],r=X.C.grupos[g.cod];
  if(r.bud&&r.land>r.bud)o.push('Landing projetado <b>'+brl(r.land)+'</b> supera o budget aprovado em <b>'+brl(r.land-r.bud)+'</b> ('+pct(r.land/r.bud-1)+').');
  g.filhos.forEach(function(a){if(!(a.bud>0)&&(a.inc+a.fc)>0.5)o.push('<b>'+esc(a.item)+'</b> ('+esc(a.conta)+') tem '+brl(a.inc+a.fc)+' entre incorrido e forecast <b>sem budget aprovado</b>.');
    if(a.bud>0&&Math.abs(a.inc+a.fc)<0.5)o.push('<b>'+esc(a.item)+'</b> tem budget de '+brl(a.bud)+' <b>sem execução nem forecast</b>'+(a.filhos.length?' (aprovado para '+esc(a.filhos.filter(function(f){return f.bud;}).map(function(f){return f.item;}).join(', '))+')':'')+'.');
    a.filhos.forEach(function(f){if(f.fc>0.5&&f.fc>=0.5*r.fc)o.push('Forecast concentrado em <b>'+esc(f.item)+'</b>: '+brl(f.fc)+' ('+pct(f.fc/r.fc)+' do forecast do grupo)'+(Object.keys(f.fm).length?' · memória: '+Object.keys(f.fm).map(function(k){return MESL[k]+' ='+esc(f.fm[k]);}).join('; '):'')+'.');});});
  var porF={};led.forEach(function(l){porF[l.forn]=(porF[l.forn]||0)+l.mov;});var tops=Object.keys(porF).sort(function(a,b){return porF[b]-porF[a];}).slice(0,3);
  if(tops.length&&r.inc)o.push('Maiores fornecedores no realizado: '+tops.map(function(f){return esc(f)+' '+brl(porF[f])+' ('+pct(porF[f]/r.inc)+')';}).join(' · ')+'.');
  var semB=[];g.filhos.forEach(function(c){c.filhos.forEach(function(f){if(!f.bud&&(f.inc+f.fc)>0.5)semB.push(f.item);});});
  if(semB.length)o.push(semB.length+' fornecedor(es) com gasto em linhas sem budget próprio ('+esc(semB.slice(0,4).join(', '))+(semB.length>4?'…':'')+'). O budget foi aprovado em linha(s) específica(s); a comparação correta é no nível da conta.');
  return o;}
function tabItens(g,drill){var d=ST.base.d,mz=ST.meses,h='<div class="tw"><table class="t"><tr><th></th><th>Conta / fornecedor</th><th>Descrição · comentário</th><th class="num">Budget V1</th>';

    if(mz)it.m.forEach(function(v,k){s+='<td class="num" style="'+(d.real[k]?'':'color:#ad570b')+'">'+n0(v)+'</td>';});
    return s+'<td class="num">'+n0(it.inc)+'</td><td class="num">'+n0(it.fc)+'</td><td class="num"><b>'+n0(land)+'</b></td>'+varCel(v)+'<td>'+(it.bud?barra(land,it.bud):(land>0.5?'<span class="chip c-warn">sem budget</span>':''))+'</td></tr>';}
  g.filhos.forEach(function(a){var ativo=a.bud||a.inc||a.fc||a.filhos.some(function(f){return f.bud||f.inc||f.fc;});if(!ativo)return;var fs=a.filhos.filter(function(f){return f.bud||f.inc||f.fc;});

  return'<div class="al '+a.nivel+'"><div class="h">'+ch+'<span class="chip c-gray">'+a.cod+'</span><span class="tx">'+esc(a.titulo)+'</span></div>'+(a.det?'<div class="d">'+esc(a.det)+'</div>':'')+(a.ocorr&&a.ocorr.length?'<details><summary>Ver '+a.ocorr.length+' ocorrência(s)</summary><div class="oc">'+a.ocorr.slice(0,400).map(esc).join('<br>')+'</div></details>':'')+'</div>';}

/* ---------- IMPORTAÇÃO ---------- */
var PEND=null;
async function lerPlanilha(f){if(!/\.xlsx$/i.test(f.name))throw new Error('Selecione o arquivo .xlsx do CoS_Budget.');if(f.size>60*1048576)throw new Error('Arquivo acima de 60 MB.');
  var buf=await f.arrayBuffer(),sha=await shaBuf(buf);aviso('Lendo a planilha ('+(f.size/1048576).toFixed(1)+' MB)…','info');await new Promise(function(r){setTimeout(r,30);});
  var wb=XLSXLite.read(buf),d=BudMotor.extrair(wb),hd=await shaTxt(BudMotor.canon(d)),C=BudMotor.calcular(d),hr=await hashResultado(d,C,hd),V=BudMotor.validar(d);
  return{d:d,arq:{nome:f.name,tam:f.size,sha:sha},hashDados:hd,hashRes:hr,V:V,C:C};}
async function importar(f){try{var P=await lerPlanilha(f);$('aviso').innerHTML='';PEND=P;
  if(ST.base&&ST.base.arq.sha===P.arq.sha){aviso('Este arquivo já é a base vigente (mesmo SHA-256).','info');PEND=null;return;}
  var cmp=ST.base?BudMotor.comparar(ST.base.d,P.d):null,cnt=contagem(P.V),t=P.C.total;
  var h='<table class="t"><tr><td>Arquivo</td><td><b>'+esc(P.arq.nome)+'</b></td></tr><tr><td>SHA-256</td><td class="hash">'+P.arq.sha+'</td></tr><tr><td>Fechamento</td><td>Realizado até <b>'+ymTxt(P.d.fechamento)+'</b></td></tr>'+
    '<tr><td>Totais recalculados</td><td>Budget '+brl(t.bud)+' · Incorrido '+brl(t.inc)+' · Forecast '+brl(t.fc)+' · Landing <b>'+brl(t.land)+'</b></td></tr><tr><td>Verificações</td><td>'+cnt.erro+' inconsistência(s) · '+cnt.alerta+' alerta(s) · '+cnt.ok+' OK</td></tr></table>';
  if(ST.base){var t0=X.C.total;h+='<h4 style="margin:14px 0 6px">Comparação com a base vigente ('+esc(ST.base.arq.nome)+', '+ymTxt(ST.base.d.fechamento)+')</h4><table class="t"><tr><th></th><th class="num">Vigente</th><th class="num">Nova</th><th class="num">Δ</th></tr>'+
    [['Budget',t0.bud,t.bud],['Incorrido',t0.inc,t.inc],['Forecast',t0.fc,t.fc],['Landing',t0.land,t.land]].map(function(x){return'<tr><td>'+x[0]+'</td><td class="num">'+n0(x[1])+'</td><td class="num">'+n0(x[2])+'</td><td class="num">'+n0(x[2]-x[1])+'</td></tr>';}).join('')+'</table>';
    h+='<p class="small" style="margin-top:8px">'+cmp.alterados.length+' item(ns) alterado(s) · '+cmp.novos.length+' novo(s) · '+cmp.removidos.length+' removido(s)</p>';
    if(cmp.alterados.length)h+='<div class="tw" style="max-height:220px;margin-top:6px"><table class="t"><tr><th>Item</th><th>Campo</th><th class="num">De</th><th class="num">Para</th></tr>'+cmp.alterados.slice(0,200).map(function(a){return a.ch.map(function(c){return'<tr><td class="small">'+esc(a.it.cod+' '+a.it.item)+'</td><td>'+c.campo+'</td><td class="num">'+(typeof c.de==='number'?n0(c.de):esc(c.de))+'</td><td class="num">'+(typeof c.para==='number'?n0(c.para):esc(c.para))+'</td></tr>';}).join('');}).join('')+'</table></div>';
    PEND.cmp={alt:cmp.alterados.length,nov:cmp.novos.length,rem:cmp.removidos.length};}
  modal('Nova planilha de budget',h,[['Cancelar',null],['Aplicar como base vigente',aplicar]]);
}catch(e){console.error(e);aviso('✖ '+esc(e.message),'bad');}}
async function aplicar(){var P=PEND;if(!P)return;var b={d:P.d,arq:P.arq,hashDados:P.hashDados,hashRes:P.hashRes,aplicadoEm:Date.now(),aplicadoPor:ST.usuario};b.arq.por=ST.usuario;
  await DB.set('base',b);ST.base=b;ST.ciente=null;await DB.set('ciente',null);derivar();
  await logar('Aplicou base',P.arq.nome+' · SHA-256 arquivo '+P.arq.sha+' · dados '+P.hashDados+' · resultado '+P.hashRes+' · fechamento '+P.d.fechamento+(P.cmp?' · '+P.cmp.alt+' alterados, '+P.cmp.nov+' novos, '+P.cmp.rem+' removidos':''));PEND=null;render();aviso('✔ Base atualizada: '+esc(P.arq.nome)+'.');}

/* ---------- EMISSÃO, VERIFICAÇÃO, EXPORTAÇÃO ---------- */
async function emitir(){var b=ST.base,obs=prompt('Emitir versão '+(ST.versoes.length+1)+' (fechamento '+ymTxt(b.d.fechamento)+')?\nObservação (opcional):','');if(obs===null)return;
  var hdChk=await shaTxt(BudMotor.canon(b.d));if(hdChk!==b.hashDados){aviso('✖ O hash dos dados guardados não confere com o registrado. Emissão bloqueada.','bad');return;}
  var n=ST.versoes.length+1,t=X.C.total,v={n:n,em:Date.now(),por:ST.usuario,obs:obs,fechamento:b.d.fechamento,arq:b.arq,hashDados:b.hashDados,hashRes:b.hashRes,kpis:{bud:t.bud,inc:t.inc,fc:t.fc,land:t.land},alertas:contagem(X.V),ciente:ST.ciente||null};
  await DB.set('ver:'+('00'+n).slice(-3),Object.assign({d:b.d},v));ST.versoes.push(v);await DB.set('veridx',ST.versoes);
  await logar('Emitiu versão','v'+n+' · fechamento '+b.d.fechamento+' · landing '+brl(t.land)+' · SHA-256 resultado '+b.hashRes+(obs?' · obs: '+obs:''));render();aviso('✔ Versão v'+n+' emitida. SHA-256 do resultado: <span class="mono">'+b.hashRes+'</span>');}
async function verificar(d,hdRef,hrRef,rot){var hd=await shaTxt(BudMotor.canon(d)),C=BudMotor.calcular(d),hr=await hashResultado(d,C,hd),ok=hd===hdRef&&hr===hrRef;
  await logar('Verificou integridade',rot+' · '+(ok?'conferido':'DIVERGENTE')+' · dados '+hd+' · resultado '+hr);
  modal('Verificação de integridade · '+rot,'<div class="banner '+(ok?'b-ok':'b-bad')+'">'+(ok?'✔ Íntegro: os dados guardados reproduzem exatamente os hashes registrados.':'✖ Divergência: os dados guardados não reproduzem os hashes registrados.')+'</div><table class="t"><tr><th></th><th>Registrado</th><th>Recalculado agora</th></tr><tr><td>Dados</td><td class="hash">'+hdRef+'</td><td class="hash">'+hd+'</td></tr><tr><td>Resultado</td><td class="hash">'+hrRef+'</td><td class="hash">'+hr+'</td></tr></table>',[['Fechar',null]]);}
function linhasItens(d){var r=[['Linha','Nível','Código','Item','Responsável','Descrição','Conta','CC','Budget V1','Incurred','Forecast','Landing','Variação'].concat(MESL).concat(['Comentário','Memória forecast'])];
  d.itens.forEach(function(it){r.push([it.lin,it.niv,it.cod,it.item,it.resp,it.desc,it.conta,it.cc,it.bud==null?'':it.bud,it.inc,it.fc,it.inc+it.fc,(it.bud||0)-it.inc-it.fc].concat(it.m).concat([it.com,Object.keys(it.fm).map(function(k){return MESL[k]+': ='+it.fm[k];}).join(' | ')]));});return r;}
async function exportar(d,meta,suf){var C=BudMotor.calcular(d),V=BudMotor.validar(d),T=BudMotor.arvore(d),t=C.total;
  var res=[['Campo','Valor'],['Relatório','Budget de Engenharia · auditoria'],['Gerado em',fmtDH(Date.now())],['Gerado por',ST.usuario],['Versão',meta.versao||'base vigente (não emitida)'],['Arquivo de origem',meta.arq.nome],['SHA-256 do arquivo',meta.arq.sha],['SHA-256 dos dados',meta.hashDados],['SHA-256 do resultado',meta.hashRes],['Método',BudMotor.VERSAO],['Fechamento (realizado até)',d.fechamento],
    ['Budget V1',t.bud],['Incorrido',t.inc],['Forecast',t.fc],['Landing',t.land],['Variação',t.var],['Total Incurred na linha "Engineering" da planilha',C.totalPlanilha.inc],['Arquivo sem macros','Sim (.xlsx)']];
  var gr=[['Código','Grupo','Responsável','Budget V1','Incorrido','Forecast','Landing','Variação','% do budget']];T.grupos.forEach(function(g){var r=C.grupos[g.cod];gr.push([g.cod,g.item,g.resp,r.bud,r.inc,r.fc,r.land,r.var,r.pctLand==null?'':r.pctLand]);});
  var lc=[['Linha origem','Data','Período','Conta','Descrição conta','Fornecedor','Histórico','Documento','Débito','Crédito','Movimento','Grupo']];d.led.forEach(function(l){lc.push([l.lin,l.data,l.per,l.conta,l.descConta,l.forn,l.hist,l.doc,l.deb,l.cred,l.mov,l.grupo]);});

function csv(rows,nome){var q=function(v){v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v)&&isNaN(Number(v)))v="'"+v;return'"'+v.replace(/"/g,'""')+'"';};var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(function(r){return r.map(q).join(';');}).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=nome;document.body.appendChild(a);a.click();a.remove();}

var avisoT;function aviso(msg,tipo){var el=$('aviso');el.innerHTML='<div class="banner b-'+(tipo||(String(msg).indexOf('✖')>=0?'bad':'ok'))+'" style="display:flex;gap:10px"><div style="flex:1">'+msg+'</div><button class="btn s" data-act="fecha">✕</button></div>';clearTimeout(avisoT);if(tipo!=='bad'&&tipo!=='info')avisoT=setTimeout(function(){el.innerHTML='';},15000);}

document.addEventListener('click',async function(e){var t=e.target.closest('[data-act],[data-mb]');if(!t)return;

  else if(a==='fecha')$('aviso').innerHTML='';
  else if(a==='tog'){ST.abertos[t.dataset.c]=!ST.abertos[t.dataset.c];render();}
  else if(a==='expandir'||a==='recolher'){var g=X.T.porCod[t.dataset.g];g.filhos.forEach(function(f){ST.abertos[f.cod]=a==='expandir';});render();}

  else if(a==='exportar')await exportar(ST.base.d,ST.base,'base');

  else if(a==='csv'){var id=t.dataset.id,d=ST.base.d,L=d.led;if(id==='all'){if(ST.fGrupo)L=L.filter(function(l){var g=X.grupoConta[l.conta];return g&&g.cod===ST.fGrupo;});if(ST.fMes)L=L.filter(function(l){return l.per===ST.fMes;});}else{var g2=X.T.porCod[id.slice(1)],cs=contasDoGrupo(g2);L=L.filter(function(l){return cs[l.conta];});}
    var q=(ST['q'+id]||'').toLowerCase();if(q)L=L.filter(function(l){return(l.hist+' '+l.forn+' '+l.doc+' '+l.descConta+' '+l.conta).toLowerCase().indexOf(q)>=0;});
    csv([['Linha origem','Data','Período','Conta','Descrição conta','Fornecedor','Histórico','Documento','Valor']].concat(L.map(function(l){return[l.lin,l.data,l.per,l.conta,l.descConta,l.forn,l.hist,l.doc,l.mov.toFixed(2).replace('.',',')];})),'Lancamentos_Eng_'+d.fechamento+'.csv');await logar('Exportou CSV de lançamentos',L.length+' linhas');}
  else if(a==='bkp'){var all=await DB.range(''),txt=JSON.stringify({app:'plataformaEng_budget',gerado:Date.now(),itens:all});var h=await shaTxt(txt),el=document.createElement('a');el.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));el.download='backup_budget_eng_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(el);el.click();el.remove();await logar('Exportou backup',all.length+' registros · SHA-256 '+h);}
  else if(a==='bkpin')$('f-bkp').click();
  else if(a==='usuario')pedirUsuario();
  }catch(err){console.error(err);aviso('✖ '+esc(err.message),'bad');}});
document.addEventListener('change',async function(e){var t=e.target;try{
  if(t.id==='f-xlsx'){if(t.files[0])await importar(t.files[0]);t.value='';}
  else if(t.id==='f-bkp'){if(!t.files[0])return;var o=JSON.parse(await t.files[0].text());if(o.app!=='plataformaEng_budget')throw new Error('Arquivo não é backup deste módulo.');if(!confirm('Restaurar '+o.itens.length+' registros?'))return;for(var i=0;i<o.itens.length;i++)await DB.set(o.itens[i].k,o.itens[i].v);await logar('Restaurou backup',t.files[0].name);await iniciar();t.value='';}
  else if(t.id==='inclPay'){ST.inclPay=t.checked;render();}
  else if(t.id==='meses'){ST.meses=t.checked;render();}
  else if(t.id==='fGrupo'){ST.fGrupo=t.value;render();}else if(t.id==='fMes'){ST.fMes=t.value;render();}
  else if(t.id==='ciente'&&t.checked){ST.ciente={por:ST.usuario,em:Date.now(),h:Motor0hash(X.V),base:ST.base.hashDados};await DB.set('ciente',ST.ciente);await logar('Ciente das inconsistências',X.V.filter(function(a){return a.nivel==='erro'||a.nivel==='alerta';}).map(function(a){return a.cod;}).join(', '));render();}
  }catch(err){console.error(err);aviso('✖ '+esc(err.message),'bad');}});
var qT;document.addEventListener('input',function(e){var t=e.target;if(t.dataset.q){ST['q'+t.dataset.q]=t.value;clearTimeout(qT);qT=setTimeout(function(){var pos=t.selectionStart;render();var n=document.querySelector('[data-q="'+t.dataset.q+'"]');if(n){n.focus();n.setSelectionRange(pos,pos);}},250);}
  else if(t.id==='qLog'){ST.qLog=t.value;clearTimeout(qT);qT=setTimeout(rLog,250);}});
['dragover','dragenter'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();var z=e.target.closest&&e.target.closest('.dz');if(z)z.classList.add('over');});});
document.addEventListener('drop',async function(e){e.preventDefault();var f=e.dataTransfer.files[0];if(f)await importar(f);});
function pedirUsuario(){modal('Identificação','<p style="margin-bottom:10px">Informe seu nome. Ele é registrado em cada importação, verificação, emissão e exportação.</p><input type="text" id="nomeU" value="'+esc(ST.usuario)+'" style="width:100%">',[['Salvar',async function(){var v=($('nomeU')||{}).value;v=(v||'').trim();if(!v){pedirUsuario();return;}var old=ST.usuario;ST.usuario=v;await DB.set('usuario',v);await logar('Identificação',old?'de "'+old+'" para "'+v+'"':'primeiro acesso');render();}]]);}
async function iniciar(){ST.usuario=(await DB.get('usuario'))||'';ST.base=(await DB.get('base'))||null;ST.versoes=(await DB.get('veridx'))||[];ST.ciente=(await DB.get('ciente'))||null;derivar();render();}
(async function(){try{await DB.open();await iniciar();if(!ST.usuario)pedirUsuario();}catch(e){console.error(e);document.body.insertAdjacentHTML('afterbegin','<div class="banner b-bad">Armazenamento local indisponível: '+esc(e.message)+'</div>');}})();
</script></body></html>
